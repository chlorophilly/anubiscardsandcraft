<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Kanit:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Hyperia City CI v2: sky to gold sunburst, rainbow ribbons, marigold petals, cream type with bronze extrusion.
   Layout: thank you hero with the three heroes, a gold framed letter from the team, a ticket style feedback card, alliance footer. */
:root{
  --sky:#3E9BE0; --sky2:#8CCBF2; --horizon:#FFE9B8; --gold:#F2B23E; --goldlt:#FAD77E;
  --cream:#FFF6DE; --navy:#141633; --bronze:#5E3511; --bronze2:#A5622A;
  --marigold:#F07A1E; --magenta:#E2478F; --teal:#1FB5AE; --violet:#8F7BE0; --crimson:#C8202F; --card:#FFFFFF; --line:#EADFC6;
  --display:'Big Shoulders Display','Kanit','Arial Narrow',Impact,sans-serif;
  --body:'Kanit','Noto Sans Thai',system-ui,sans-serif;
  --label:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gold);color:var(--navy);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* top bar (Anubis frame, the Hyperia look leads) */
.anubar{background:var(--navy);color:var(--cream)}
.anubar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.anubar a{color:var(--cream);text-decoration:none;display:flex;align-items:center;gap:8px;font:700 14px var(--label);letter-spacing:.04em}
.anubar a img{width:26px;height:26px}
.anubar .site{font:600 13px var(--label);color:var(--goldlt)}
@media (max-width:420px){.anubar .site{display:none}}

/* sky hero */
.sky{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 50%,var(--horizon) 84%,var(--goldlt) 100%)}
.sky::before{content:"";position:absolute;left:50%;top:70%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0deg 4deg,rgba(255,255,255,0) 4deg 12deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 22%,transparent 55%);mask:radial-gradient(circle,#000 0,#000 22%,transparent 55%);pointer-events:none}
.city{position:absolute;left:0;right:0;bottom:84px;height:130px;pointer-events:none;opacity:.55}
.ribbons{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-30px;width:14px;height:20px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#FFB547,var(--marigold));opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0)}100%{transform:translate3d(60px,640px,0) rotate(540deg)}}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 0}
.top img{height:clamp(48px,8.5vw,80px);width:auto;filter:drop-shadow(0 4px 6px rgba(20,22,51,.18))}
.lang{display:flex;border:3px solid var(--navy);border-radius:999px;overflow:hidden;background:var(--cream);box-shadow:0 4px 0 var(--navy);flex:none}
.lang button{border:0;background:transparent;color:var(--navy);font:800 15px var(--label);letter-spacing:.12em;padding:8px 14px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.lang button:focus-visible{outline:3px solid var(--marigold);outline-offset:-3px}

.hero{position:relative;z-index:1;text-align:center;padding-block:14px 0}
.eyebrow{display:inline-block;font:800 13px var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:var(--navy);padding:7px 12px;border-radius:8px}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.86;margin:14px auto 12px;max-width:11ch;
  font-size:clamp(60px,12vw,132px);color:var(--cream);text-wrap:balance;
  text-shadow:1px 1px 0 var(--bronze),2px 2px 0 var(--bronze),3px 3px 0 var(--bronze),4px 4px 0 var(--bronze),5px 5px 0 var(--bronze),6px 6px 0 var(--bronze),7px 7px 0 var(--bronze),8px 8px 0 var(--bronze),9px 9px 0 var(--bronze),10px 10px 0 var(--bronze),11px 11px 0 rgba(20,22,51,.25)}
.lede{font-size:clamp(17px,2.4vw,22px);font-weight:600;max-width:44ch;margin:0 auto;color:var(--navy);text-wrap:balance}
.cast{position:relative;height:clamp(170px,30vw,300px);margin-top:6px}
.cast img{position:absolute;bottom:0;filter:drop-shadow(0 14px 18px rgba(60,30,5,.35))}
.cast .miguel{left:2%;width:clamp(120px,22vw,220px)}
.cast .cind{left:50%;transform:translateX(-50%);width:clamp(150px,27vw,270px);bottom:-6px}
.cast .goofy{right:1%;width:clamp(140px,25vw,250px)}
.cast .sticker{left:auto;right:30%;top:-8px;bottom:auto;width:clamp(70px,11vw,110px);transform:rotate(-9deg)}
@media (prefers-reduced-motion:no-preference){ .cast .sticker{animation:bob 3.2s ease-in-out infinite} @keyframes bob{50%{transform:rotate(-6deg) translateY(-6px)}} }
@media (prefers-reduced-motion:reduce){ .petals{display:none} }

/* letter */
main{position:relative;z-index:2}
.letter{position:relative;margin-top:-58px;background:var(--cream);border:5px solid var(--navy);border-radius:22px;box-shadow:0 9px 0 var(--navy);padding:clamp(22px,4vw,40px) clamp(18px,4.4vw,48px)}
.letter::before{content:"";position:absolute;inset:10px;border:2px solid var(--gold);border-radius:14px;pointer-events:none}
.letter::after{content:"";position:absolute;inset:16px;border:1px dashed var(--bronze2);border-radius:10px;opacity:.4;pointer-events:none}
.letter .corner{position:absolute;width:30px;height:30px;color:var(--gold)}
.letter .c1{left:14px;top:14px}.letter .c2{right:14px;top:14px;transform:scaleX(-1)}.letter .c3{left:14px;bottom:14px;transform:scaleY(-1)}.letter .c4{right:14px;bottom:14px;transform:scale(-1)}
.letter h2{position:relative;margin:0 0 4px;text-align:center;font:900 clamp(30px,5vw,44px)/1 var(--display);text-transform:uppercase;color:var(--bronze)}
.letter .sub{position:relative;text-align:center;font:800 12px var(--label);letter-spacing:.24em;color:var(--bronze2);margin:0 0 18px}
.letter p{position:relative;margin:0 0 14px;font-size:clamp(16px,2.1vw,18px);max-width:62ch;margin-inline:auto}
.sign{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.sign .with{font-weight:600;color:var(--bronze2)}
.sign .who{font:900 26px/1 var(--display);text-transform:uppercase}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badges img{width:58px;height:58px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 3px var(--bronze2),0 6px 10px rgba(60,30,5,.3)}

/* feedback card */
.fb{position:relative;margin-top:30px;background:var(--card);border:5px solid var(--navy);border-radius:22px;box-shadow:0 9px 0 var(--navy);overflow:hidden}
.fb header{background:var(--navy);color:var(--cream);padding:16px clamp(16px,3.4vw,28px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.fb header h2{margin:0;font:900 clamp(30px,5vw,42px)/1 var(--display);text-transform:uppercase;color:var(--goldlt)}
.due{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.due b{font:800 13px var(--label);letter-spacing:.1em;color:var(--cream)}
.due span{font:700 14px var(--body);color:var(--goldlt)}
.anon{display:flex;gap:12px;align-items:flex-start;margin:18px clamp(16px,3.4vw,28px) 0;background:#E9F7F6;border:3px solid var(--teal);border-radius:14px;padding:12px 14px}
.anon svg{flex:none;width:30px;height:30px;color:var(--teal)}
.anon b{display:block;font:900 22px/1.05 var(--display);text-transform:uppercase;color:#0F6E69}
.anon span{font-size:15px;font-weight:500}
form{padding:8px clamp(16px,3.4vw,28px) 24px}
.q{margin-top:18px}
.q label{display:flex;align-items:baseline;gap:10px;font:700 clamp(19px,2.8vw,23px)/1.25 var(--body);color:var(--navy)}
.q label .no{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font:900 20px/1 var(--display);transform:translateY(4px)}
.q:nth-of-type(1) .no{background:var(--magenta)} .q:nth-of-type(2) .no{background:var(--marigold)}
.q .hint{margin:4px 0 8px 44px;font-size:15px;color:var(--bronze2);font-weight:500}
textarea{display:block;width:100%;min-height:150px;resize:vertical;border:3px solid var(--navy);border-radius:14px;background:var(--cream);color:var(--navy);font:500 17px/1.5 var(--body);padding:12px 14px;outline:none}
textarea::placeholder{color:#A8977A}
textarea:focus{box-shadow:0 0 0 4px var(--goldlt);background:#fff}
.cnt{text-align:right;font:600 13px var(--label);color:#9C8A6B;margin-top:4px}
.cnt.max{color:var(--crimson)}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:20px}
.send{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--navy);background:var(--marigold);color:#fff;font:900 clamp(24px,3.6vw,30px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em;border-radius:16px;padding:14px 26px;box-shadow:0 6px 0 var(--navy);cursor:pointer;transition:transform .08s,box-shadow .08s}
.send:hover{background:#E46A0E}
.send:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.send:disabled{opacity:.6;cursor:progress}
.send svg{width:26px;height:26px}
.note{font-size:14.5px;color:var(--bronze2);font-weight:600}
.err{margin-top:14px;font-weight:700;color:var(--crimson)}
button:focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

/* sent and closed states */
.state{padding:clamp(26px,5vw,44px) clamp(16px,4vw,32px);text-align:center}
.state .big{font:900 clamp(40px,7vw,64px)/.95 var(--display);text-transform:uppercase;color:var(--navy);margin:10px 0 10px}
.state p{max-width:46ch;margin:0 auto 18px;font-size:17px}
.state .seal{width:92px;height:92px;margin:0 auto;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 5px var(--navy),0 8px 0 5px var(--navy)}
.state .seal svg{width:50px;height:50px;color:var(--navy)}
.again{border:3px solid var(--navy);background:#fff;color:var(--navy);font:800 16px var(--body);border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--navy)}

/* burst on send */
.burst{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.burst i{position:absolute;width:14px;height:20px;border-radius:70% 0 70% 0;animation:pop 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* footer */
footer{padding-block:30px 36px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.flab{font:800 12px var(--label);letter-spacing:.2em;color:var(--bronze);margin-bottom:8px}
footer .badges{justify-content:flex-start}
footer .badges img{width:66px;height:66px}
.spons{display:flex;gap:12px}
.spons div{width:96px;height:70px;background:#fff;border-radius:14px;box-shadow:0 0 0 3px var(--bronze2),0 6px 10px rgba(60,30,5,.3);display:flex;align-items:center;justify-content:center}
.spons img{max-width:80px;max-height:54px}
.more{width:100%;margin:0;font-weight:700;font-size:15px}
.more a{color:var(--navy)}

@media (max-width:640px){
  .cast .miguel{left:-4%} .cast .goofy{right:-5%} .cast .sticker{right:6%;top:-24px}
  .due{align-items:flex-start;text-align:left}
  .q .hint{margin-left:0}
  .send{width:100%;justify-content:center}
}
html[lang="th"] .letter h2,html[lang="th"] .fb header h2,html[lang="th"] .state .big{font-family:var(--body);font-weight:800;letter-spacing:0}
html[lang="th"] .flab{letter-spacing:.06em}
@media (max-width:640px){ .letter{padding:30px 26px} }
@media (max-width:420px){ h1{font-size:54px} .lede{font-size:16px} .cast .sticker{display:none} }
</style>
</head>
<body>
<div class="anubar"><div class="wrap">
  <a href="/" aria-label="Anubis Cards and Craft home"><img src="../favicon.svg" alt="" width="26" height="26"><span>Anubis Cards and Craft</span></a>

</div></div>

<div class="sky">
  <div class="petals" id="petals" aria-hidden="true"></div>
  <svg class="city" viewBox="0 0 1200 130" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#FFF6DE" d="M0 130V88h40V62h26v26h22V40h34v48h18V70h30v18h26V30l20-18 20 18v58h24V56h40v32h20V74h28v14h30V44h22V22h12v22h22v44h26V60h36v28h18V50l26-20 26 20v38h24V68h34v20h22V36h40v52h20V64h30v24h24V48h18V26h10v22h18v40h30V58h38v30h22V72h26v16h30V42h36v46h26V66h32v22h20V54h28v34h0v42z"/>
  </svg>
  <svg class="ribbons" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">

        <img class="miguel" src="../hyperiacity-prerelease-party/img/miguel.webp" alt="">

        <img class="cind" src="../hyperiacity-prerelease-party/img/cind.webp" alt="">
        <img class="sticker" src="../hyperiacity-prerelease-party/img/sticker.webp" alt="">

</div>

<main class="wrap">
  <article class="letter" aria-labelledby="letter-h">
    <svg class="corner c1" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V8a6 6 0 0 1 6-6h20M8 28V14a6 6 0 0 1 6-6h14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="15" cy="15" r="2.4" fill="currentColor"/></svg>
    <svg class="corner c2" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V8a6 6 0 0 1 6-6h20M8 28V14a6 6 0 0 1 6-6h14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="15" cy="15" r="2.4" fill="currentColor"/></svg>
    <svg class="corner c3" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V8a6 6 0 0 1 6-6h20M8 28V14a6 6 0 0 1 6-6h14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="15" cy="15" r="2.4" fill="currentColor"/></svg>
    <svg class="corner c4" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V8a6 6 0 0 1 6-6h20M8 28V14a6 6 0 0 1 6-6h14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="15" cy="15" r="2.4" fill="currentColor"/></svg>
    <h2 id="letter-h" data-i="lh"></h2>
    <p class="sub">HYPERIA CITY ✦ PRERELEASE PARTY</p>
    <p data-i="l1"></p>
    <p data-i="l2"></p>
    <p data-i="l3"></p>
    <div class="sign">
      <span class="with" data-i="with"></span>
      <span class="who" data-i="team"></span>
      <div class="badges">
        <img src="../hyperiacity-prerelease-party/img/b_anubis.webp" alt="Anubis Cards and Craft">
        <img src="../hyperiacity-prerelease-party/img/b_magicdojo.webp" alt="Magic Dojo">
        <img src="../hyperiacity-prerelease-party/img/b_quest.webp" alt="Quest Boardgame Cafe">

  </article>

  <section class="fb" id="fb" aria-labelledby="fb-h">
    <header>
      <h2 id="fb-h" data-i="fbh"></h2>
      <div class="due"><b data-i="due"></b><span id="left" aria-live="off"></span></div>

    <div id="open-state">
      <div class="anon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <div><b data-i="anonh"></b><span data-i="anon"></span></div>

      <form id="form" novalidate>

      </form>
    </div>

    <div class="state" id="sent-state" hidden tabindex="-1">
      <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      <div class="big" data-i="okh"></div>
      <p data-i="ok"></p>
      <button class="again" id="again" type="button" data-i="again"></button>
    </div>

    <div class="state" id="closed-state" hidden>
      <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></div>
      <div class="big" data-i="closedh"></div>
      <p data-i="closed"></p>
    </div>
  </section>

  <footer>
    <div>
      <div class="flab" data-i="presented"></div>
      <div class="badges">
        <img src="../hyperiacity-prerelease-party/img/b_anubis.webp" alt="Anubis Cards and Craft">
        <img src="../hyperiacity-prerelease-party/img/b_magicdojo.webp" alt="Magic Dojo">
        <img src="../hyperiacity-prerelease-party/img/b_quest.webp" alt="Quest Boardgame Cafe">
        <img src="../hyperiacity-prerelease-party/img/b_glorytale.webp" alt="Glorytale Guild Boardgame">
      </div>
    </div>
    <div>
      <div class="flab">SPONSORED BY</div>
      <div class="spons"><div><img src="../hyperiacity-prerelease-party/img/kardiko.webp" alt="Kardiko"></div><div><img src="../hyperiacity-prerelease-party/img/saka.webp" alt="Saka Saka"></div></div>
    </div>
    <p class="more"><a href="/#calendar" data-i="more"></a></p>
  </footer>
</main>

<script>
(function(){
  /* Google Apps Script web app (writes to the team's private Google Sheet). */
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwOFaL1oieqO04JVWjKQYpWnZq0kAqXQ-OFcahJqnk2YKt2NWdIs-qCZ2XT6EvBgP8/exec';
  /* Closes Fri 30 Oct 2026, 23:59 Bangkok time. The server enforces the same time. */
  const CLOSES_AT = new Date('2026-10-30T23:59:59+07:00');
  const MAX = 2000;

  const T={
    th:{
      lede:'ขอบคุณจากใจที่มาร่วมทำให้ Hyperia City มีชีวิตชีวาขนาดนี้ครับ',
      lh:'จดหมายจากทีมงาน',
      l1:'วันอาทิตย์ที่ 25 ตุลาคม ห้องจัดงาน Prerelease Party เต็มไปด้วยเสียงแกะซอง เสียงลุ้นการ์ด และเสียงหัวเราะตั้งแต่เช้าจนเย็น ภาพแบบนั้นคือสิ่งที่พวกเราฝันถึงตั้งแต่วันแรกที่เริ่มวางแผนงานนี้ และมันเกิดขึ้นได้จริงเพราะทุกคนครับ',
      l2:'ขอบคุณที่ไว้ใจมาร่วมงานกับเรา ขอบคุณที่ตื่นเช้ามาเช็กอิน ขอบคุณที่ใจดีกับเพื่อนร่วมโต๊ะทุกคน และขอบคุณที่ทำให้คอมมูนิตี้ Lorcana ในไทยอบอุ่นได้ขนาดนี้ พวกเราซึ้งใจจริงๆ ครับ',
      l3:'เราอยากให้ Prerelease Party ครั้งหน้าดียิ่งกว่าเดิม เลยอยากฟังจากใจทุกคน ชอบตรงไหน ไม่ชอบตรงไหน บอกเรามาได้เต็มที่ ทีมงานจะนั่งอ่านด้วยกันทุกข้อความครับ',
      with:'ด้วยความขอบคุณจากใจ',team:'ทีมงานทั้ง 4 ร้าน',
      fbh:'บอกเราหน่อยนะครับ',
      due:'เปิดรับถึง ศุกร์ 30 ต.ค. 23:59 น.',
      left:(d,h,m)=> d>0?`เหลืออีก ${d} วัน ${h} ชม.`:(h>0?`เหลืออีก ${h} ชม. ${m} นาที`:`เหลืออีก ${m} นาที`),
      anonh:'ไม่ระบุตัวตน',
      anon:'ไม่ต้องใส่ชื่อ ไม่ต้องล็อกอิน เราไม่เก็บชื่อ อีเมล หรือข้อมูลใดๆ ที่บอกได้ว่าคุณเป็นใคร ข้อความถึงทีมงานโดยตรงเท่านั้นครับ',
      q1:'อยากบอกอะไรกับเราบ้าง',
      h1:'ช่วงเวลาที่ประทับใจ เรื่องที่ชอบ หรืออะไรก็ได้ที่อยากเล่าให้ทีมงานฟังครับ',
      q2:'ครั้งหน้า เราจะทำให้ดีขึ้นได้อย่างไร',
      h2:'ตรงไหนที่ยังไม่ลื่น อยากให้ปรับอะไร หรืออยากเห็นอะไรเพิ่มในงานครั้งหน้า บอกมาตรงๆ ได้เลยครับ',
      p1:'พิมพ์ได้เลย...',p2:'พิมพ์ได้เลย...',
      send:'ส่งความคิดเห็น',sending:'กำลังส่ง...',
      one:'ตอบแค่ข้อเดียวก็ส่งได้ครับ',
      empty:'พิมพ์อย่างน้อยหนึ่งช่องก่อนนะครับ',
      fail:'ส่งไม่สำเร็จ ข้อความของคุณยังอยู่ครบ ลองกดส่งอีกครั้ง หรือทักเพจ Anubis Cards and Craft ได้เลยครับ',
      okh:'ได้รับแล้ว ขอบคุณมากครับ!',
      ok:'ข้อความของคุณถึงทีมงานเรียบร้อย นึกอะไรออกเพิ่ม ส่งได้อีกเรื่อยๆ จนถึงคืนวันศุกร์เลยครับ',
      again:'ส่งอีกข้อความ',
      closedh:'ปิดรับแล้วครับ',
      closed:'ขอบคุณทุกเสียงที่ส่งมา ทีมงานอ่านครบทุกข้อความแน่นอน แล้วเจอกันใน Prerelease Party ครั้งหน้านะครับ!',
      presented:'PRESENTED BY ✦ จัดเต็มจาก 4 ร้าน',
      more:'ดูอีเวนต์อื่นๆ ของ Anubis Cards and Craft ได้ที่ปฏิทินบนเว็บเลยครับ'
    },
    en:{
      lede:'You made Hyperia City come alive. From all of us, thank you.',
      lh:'A letter from the team',
      l1:'On Sunday 25 October, the Prerelease Party room was full of ripping packs, gasps at big pulls and laughter from morning to evening. That is exactly the day we dreamed of when we first started planning, and it happened because of you.',
      l2:'Thank you for trusting us, for showing up early to check in, for being kind to everyone across the table, and for making the Lorcana community in Thailand this warm. We are truly grateful.',
      l3:'We want the next Prerelease Party to be even better, so we would love to hear from you. The good, the not so good, anything at all. Our team will sit down and read every single message together.',
      with:'With all our thanks',team:'The team from 4 stores',
      fbh:'Tell us anything',
      due:'Open until Fri 30 Oct, 23:59 (Bangkok)',
      left:(d,h,m)=> d>0?`${d}d ${h}h left`:(h>0?`${h}h ${m}m left`:`${m} min left`),
      anonh:'Fully anonymous',
      anon:'No name, no login. We don\'t collect your name, email or anything that shows who you are. Your words go straight to the event team.',
      q1:'What do you want to tell us?',
      h1:'A favourite moment, something you loved, or anything you want the team to hear.',
      q2:'How can we improve next time?',
      h2:'What felt rough, what you would change, what you want to see at the next party. Be as honest as you like.',
      p1:'Start typing...',p2:'Start typing...',
      send:'Send feedback',sending:'Sending...',
      one:'Answering just one is fine.',
      empty:'Write in at least one box first.',
      fail:'That didn\'t go through. Your text is still here, so try again, or message the Anubis Cards and Craft page.',
      okh:'Got it. Thank you so much!',
      ok:'Your message reached the team. Thought of something else? Send as many as you like until Friday night.',
      again:'Send another',
      closedh:'Feedback is closed',
      closed:'Thank you for every message. We read them all. See you at the next Prerelease Party!',
      presented:'PRESENTED BY 4 STORES',
      more:'More events at Anubis Cards and Craft: see the calendar'
    }
  };

  let lang='th';
  const navLang=((navigator.language||'th').toLowerCase().startsWith('th')?'th':'en');
  let qLang=null; try{qLang=new URLSearchParams(location.search).get('lang');}catch(e){}
  if(qLang==='th'||qLang==='en') lang=qLang;
  else { try{const s=localStorage.getItem('podLang'); lang=(s==='th'||s==='en')?s:navLang;}catch(e){lang=navLang;} }

  const $=id=>document.getElementById(id);
  const tell=$('tell'), improve=$('improve'), send=$('send'), err=$('err'), form=$('form');
  const loadedAt=Date.now();
  const isClosed=()=>Date.now()>CLOSES_AT.getTime();

  function applyLang(){
    const L=T[lang]; document.documentElement.lang=lang;
    document.querySelectorAll('[data-i]').forEach(el=>{const v=L[el.dataset.i]; if(typeof v==='string') el.textContent=v;});
    tell.placeholder=L.p1; improve.placeholder=L.p2;
    document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
    if(!err.hidden) err.textContent=L[err.dataset.k]||'';
    tick();
  }
  function tick(){
    if(isClosed()){ showClosed(); return; }
    const ms=CLOSES_AT.getTime()-Date.now(), mins=Math.floor(ms/60000);
    $('left').textContent=T[lang].left(Math.floor(mins/1440),Math.floor(mins%1440/60),mins%60);
  }
  function showClosed(){
    $('open-state').hidden=true; $('sent-state').hidden=true; $('closed-state').hidden=false; $('left').textContent='';
  }

  /* keep a draft on this device only, so nothing is lost if the page closes */
  const DK='hypFbDraft';
  try{const d=JSON.parse(localStorage.getItem(DK)||'{}'); if(d.tell) tell.value=d.tell; if(d.improve) improve.value=d.improve;}catch(e){}
  function save(){ try{localStorage.setItem(DK,JSON.stringify({tell:tell.value,improve:improve.value}));}catch(e){} }
  function count(t){ const c=$(t.id+'-c'); c.textContent=t.value.length+' / '+MAX; c.classList.toggle('max',t.value.length>=MAX); }
  [tell,improve].forEach(t=>{ t.addEventListener('input',()=>{count(t);save(); if(!err.hidden && (tell.value.trim()||improve.value.trim()) && err.dataset.k==='empty') err.hidden=true;}); count(t); });

  function showErr(k){ err.dataset.k=k; err.textContent=T[lang][k]; err.hidden=false; }

  async function post(payload){
    const body=JSON.stringify(payload);
    try{
      const r=await fetch(ENDPOINT,{method:'POST',body,redirect:'follow'});
      const j=await r.json();
      return j;
    }catch(e){
      /* some browsers block reading the reply; send again without reading it */
      await fetch(ENDPOINT,{method:'POST',body,mode:'no-cors'});
      return {ok:true,blind:true};
    }
  }

  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    if(isClosed()){ showClosed(); return; }
    const a=tell.value.trim(), b=improve.value.trim();
    if(!a && !b){ showErr('empty'); tell.focus(); return; }
    if(!ENDPOINT){ showErr('fail'); return; }
    err.hidden=true; send.disabled=true; send.querySelector('span').textContent=T[lang].sending;
    try{
      const j=await post({tell:a.slice(0,MAX),improve:b.slice(0,MAX),lang,ms:Date.now()-loadedAt,website:$('website').value});
      if(j&&j.ok){
        tell.value=''; improve.value=''; count(tell); count(improve); try{localStorage.removeItem(DK);}catch(e){}
        $('open-state').hidden=true; const s=$('sent-state'); s.hidden=false; s.focus({preventScroll:true});
        $('fb').scrollIntoView({behavior:'smooth',block:'start'}); burst();
      } else if(j&&j.error==='closed'){ showClosed(); }
      else showErr(j&&j.error==='empty'?'empty':'fail');
    }catch(e){ showErr('fail'); }
    finally{ send.disabled=false; send.querySelector('span').textContent=T[lang].send; }
  });
  $('again').addEventListener('click',()=>{ $('sent-state').hidden=true; $('open-state').hidden=false; tell.focus(); });

  function burst(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box=document.createElement('div'); box.className='burst';
    const cols=['#F07A1E','#FFB547','#E2478F','#1FB5AE','#8F7BE0','#FAD77E'];
    const cx=innerWidth/2, cy=Math.min(innerHeight*0.45,360);
    for(let i=0;i<46;i++){
      const p=document.createElement('i'); const ang=Math.random()*Math.PI*2, dist=120+Math.random()*Math.min(innerWidth,520)*0.6;
      p.style.left=cx+'px'; p.style.top=cy+'px'; p.style.background=cols[i%cols.length];
      p.style.setProperty('--x',Math.cos(ang)*dist+'px'); p.style.setProperty('--y',Math.sin(ang)*dist+180+'px'); p.style.setProperty('--r',(Math.random()*720-360)+'deg');
      p.style.animationDelay=(Math.random()*.15)+'s'; box.appendChild(p);
    }
    document.body.appendChild(box); setTimeout(()=>box.remove(),2000);
  }

  /* drifting marigold petals in the sky */
  (function(){ const w=$('petals'); if(!w) return; for(let i=0;i<14;i++){ const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%'; p.style.animationDuration=(9+Math.random()*9)+'s'; p.style.animationDelay=(-Math.random()*16)+'s';
    p.style.transform='scale('+(0.6+Math.random()*0.7)+')'; if(i%4===0) p.style.background='linear-gradient(135deg,#FFD27A,#F2B23E)'; w.appendChild(p);} })();

  document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l; try{localStorage.setItem('podLang',lang)}catch(e){} applyLang();}));
  applyLang();
  if(isClosed()) showClosed();
  setInterval(tick,30000);
})();
</script>
</body>
</html>
