<style>
/* Layout: sky hero with sunburst over a gold "city floor"; one ticket style search card; two pod boards; info strip; alliance footer. Single committed look (Hyperia City CI v2). */
:root{
  --sky:#3E9BE0; --sky2:#8CCBF2; --horizon:#FFE9B8; --gold:#F2B23E; --goldlt:#FAD77E;
  --cream:#FFF6DE; --navy:#141633; --bronze:#5E3511; --bronze2:#A5622A;
  --marigold:#F07A1E; --magenta:#E2478F; --teal:#1FB5AE; --crimson:#C8202F; --card:#FFFFFF; --line:#EADFC6;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Kanit','Noto Sans Thai',system-ui,sans-serif;
  --label:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--gold);color:var(--navy);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sky{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 52%,var(--horizon) 86%,var(--goldlt) 100%)}
.sky::before{content:"";position:absolute;left:50%;top:78%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0deg 4deg,rgba(255,255,255,0) 4deg 12deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 22%,transparent 55%);mask:radial-gradient(circle,#000 0,#000 22%,transparent 55%);pointer-events:none}
.ribbons{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px 0}
.top img{height:clamp(54px,9vw,84px);width:auto;filter:drop-shadow(0 4px 6px rgba(20,22,51,.18))}
.lang{display:flex;border:3px solid var(--navy);border-radius:999px;overflow:hidden;background:var(--cream);box-shadow:0 4px 0 var(--navy);flex:none}
.lang button{border:0;background:transparent;color:var(--navy);font:800 15px var(--label);letter-spacing:.12em;padding:8px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.lang button:focus-visible{outline:3px solid var(--marigold);outline-offset:-3px}
.hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:end;gap:8px;padding-block:8px 104px}
.eyebrow{display:inline-block;font-family:var(--label);font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:var(--navy);padding:7px 12px;border-radius:8px}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.84;margin:14px 0 10px;
  font-size:clamp(68px,13.5vw,150px);color:var(--cream);text-wrap:balance;
  text-shadow:1px 1px 0 var(--bronze),2px 2px 0 var(--bronze),3px 3px 0 var(--bronze),4px 4px 0 var(--bronze),5px 5px 0 var(--bronze),6px 6px 0 var(--bronze),7px 7px 0 var(--bronze),8px 8px 0 var(--bronze),9px 9px 0 var(--bronze),10px 10px 0 var(--bronze),11px 11px 0 rgba(20,22,51,.25)}
.lede{font-size:clamp(17px,2.4vw,21px);font-weight:600;max-width:34ch;margin:0;color:var(--navy)}
.cast{position:relative;height:clamp(200px,32vw,330px)}
.cast .goofy{position:absolute;right:-4%;bottom:-34px;width:min(100%,330px);filter:drop-shadow(0 14px 18px rgba(60,30,5,.35))}
.cast .sticker{position:absolute;left:0;top:0;width:clamp(96px,15vw,150px);transform:rotate(-9deg);filter:drop-shadow(0 6px 10px rgba(20,22,51,.25))}
/* search card */
.search{position:relative;z-index:2;margin-top:-64px;background:var(--card);border:5px solid var(--navy);border-radius:22px;box-shadow:0 9px 0 var(--navy);padding:18px clamp(14px,3vw,26px)}
.search label{display:block;font-family:var(--label);font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze2);margin-bottom:8px}
.field{display:flex;align-items:center;gap:10px;border:3px solid var(--navy);border-radius:14px;padding:4px 6px 4px 14px;background:var(--cream)}
.field svg{flex:none;width:24px;height:24px;stroke:var(--navy)}
#q{flex:1;min-width:0;border:0;background:transparent;font:600 clamp(18px,3.4vw,24px) var(--body);color:var(--navy);padding:10px 0;outline:none}
#q::placeholder{color:#9C8A6B;font-weight:500}
#clear{flex:none;border:0;background:var(--navy);color:var(--cream);font:700 14px var(--label);letter-spacing:.08em;border-radius:10px;padding:10px 12px;cursor:pointer}
.field:focus-within{box-shadow:0 0 0 4px var(--goldlt)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:3px solid var(--navy);background:#fff;color:var(--navy);font:800 15px var(--body);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.chip:focus-visible,#clear:focus-visible,a:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.count{margin-left:auto;font-weight:600;color:var(--bronze2);font-size:15px}
/* found ticket */
.found{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin-top:16px;border-radius:16px;overflow:hidden;border:3px solid var(--navy);box-shadow:0 6px 0 var(--navy)}
.found .num{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 18px;color:#fff;min-width:118px}
.found .num b{font:900 clamp(40px,8vw,56px)/1 var(--display)}
.found .num span{font:800 12px var(--label);letter-spacing:.18em}
.found .who{background:var(--cream);padding:12px 18px;min-width:0}
.found .who .name{font:900 clamp(28px,5.4vw,40px)/1 var(--display);text-transform:none;word-break:break-word}
.found .who .podline{font-weight:700;font-size:18px;margin-top:6px;line-height:1.35}
.found .who .podline em{font-style:normal;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.found.m .num{background:var(--sky)} .found.a .num{background:var(--marigold)}
.found.m em{color:var(--sky)} .found.a em{color:var(--marigold)}
.miss{margin-top:14px;font-weight:600;color:var(--crimson)}
/* pods */
main{padding-block:28px 10px}
.pods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.pod{background:var(--card);border:5px solid var(--navy);border-radius:22px;box-shadow:0 9px 0 var(--navy);overflow:hidden;min-width:0}
.pod header{color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.pod.m header{background:var(--sky)} .pod.a header{background:var(--marigold)}
.pod h2{margin:0;font:900 clamp(30px,4.6vw,40px)/1 var(--display);text-transform:uppercase}
.pod h2 small{font:600 17px var(--body);text-transform:none;margin-left:6px}
.pod .ci{font:800 13px var(--label);letter-spacing:.12em}
.list{list-style:none;margin:0;padding:10px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.list li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--cream);min-width:0}
.list li b{flex:none;font:900 18px/1 var(--display);font-variant-numeric:tabular-nums}
.pod.m li b{color:var(--sky)} .pod.a li b{color:var(--marigold)}
.list li span{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.list li.hit{background:var(--goldlt);box-shadow:inset 0 0 0 2px var(--navy)}
mark{background:var(--navy);color:var(--cream);border-radius:4px;padding:0 2px}
.empty{padding:14px 18px;color:var(--bronze2);font-weight:600}
.podnote{padding:0 18px 14px;font-size:14px;color:var(--bronze2);font-weight:600}
/* info */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-block:30px 8px}
.card{background:var(--card);border:4px solid var(--navy);border-radius:18px;padding:16px 18px;min-width:0;position:relative}
.card h3{margin:0 0 6px;font:900 26px/1 var(--display);text-transform:uppercase}
.card p{margin:4px 0;font-size:15.5px}
.tag{display:inline-block;font:800 11px var(--label);letter-spacing:.18em;color:#fff;border-radius:6px;padding:4px 8px;margin-bottom:8px}
.card .row{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dashed var(--line);padding:6px 0;font-weight:600}
.card .row b{font:900 20px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:var(--crimson);font-weight:700}
.gift{display:flex;gap:12px;align-items:center}
.gift img{width:92px;flex:none;transform:rotate(-6deg);filter:drop-shadow(0 8px 10px rgba(20,22,51,.3))}
.packs{display:flex;margin-bottom:6px}.packs img{width:52px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}.packs img+img{margin-left:-14px}
/* footer */
footer{padding-block:26px 34px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.flab{font:800 12px var(--label);letter-spacing:.2em;color:var(--bronze);margin-bottom:8px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badges img{width:72px;height:72px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 3px var(--bronze2),0 6px 10px rgba(60,30,5,.3)}
.spons{display:flex;gap:12px}
.spons div{width:96px;height:72px;background:#fff;border-radius:14px;box-shadow:0 0 0 3px var(--bronze2),0 6px 10px rgba(60,30,5,.3);display:flex;align-items:center;justify-content:center}
.spons img{max-width:80px;max-height:56px}
.fine{width:100%;font-size:13px;color:var(--bronze);font-weight:500}
/* Anubis frame: slim bar on top, one line in the footer. The Hyperia look leads. */
.anubar{background:var(--navy);color:var(--cream)}
.anubar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.anubar a{color:var(--cream);text-decoration:none;display:flex;align-items:center;gap:8px;font:700 14px var(--label);letter-spacing:.04em}
.anubar a img{width:26px;height:26px}
.anubar .site{font:600 13px var(--label);color:var(--goldlt);letter-spacing:.02em}
.anubar a:hover .site,.anubar a:hover span{text-decoration:underline}
.more{width:100%;margin:0;font-weight:700;font-size:15px}
.more a{color:var(--navy)}
@media (max-width:420px){.anubar .site{display:none}}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .cast{position:absolute;right:0;top:2px;width:96px;height:auto;pointer-events:none}
  .cast .goofy{display:none}
  .cast .sticker{position:static;width:96px}
  .lede{max-width:100%}
  .hero{padding-block:6px 96px}
  .pods,.info{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
}
html[lang="th"] .search label{letter-spacing:.02em;font-family:var(--body);font-size:15px}
@media (max-width:520px){ .cast{display:none} }
@media (max-width:420px){ h1{font-size:62px} .lede{font-size:16px} .list{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){ .cast .sticker{animation:bob 3.2s ease-in-out infinite} @keyframes bob{50%{transform:rotate(-6deg) translateY(-6px)}} }
</style>

</head>

        pr:'<b>Pack Rush</b> ไม่ต้องจัดเด็ค แกะ 2 ซองต่อรอบ 3 รอบ ✦ ลงทะเบียนแยก เปิดให้ทุกคน',cc:'<b>Core Constructed</b> Side Event ✦ Walk in ไม่ต้องลงทะเบียน',
        follow:'ติดตามรายละเอียดทางเพจ',more:'ดูอีเวนต์อื่นๆ ของ Anubis Cards and Craft ได้ที่ปฏิทินบนเว็บเลยครับ',presented:'PRESENTED BY ✦ จัดเต็มจาก 4 ร้าน',
        fine:'จัดรอบตามลำดับเวลาที่ลงทะเบียน ✦ รายชื่ออัปเดตล่าสุด '+UPD.th+' ✦ ไม่เจอชื่อหรือข้อมูลไม่ตรง ทักเพจ Anubis Cards and Craft ได้เลยครับ',
        total:n=>'',found:n=>`พบ ${n} รายชื่อ`,empty:'ไม่พบชื่อในรอบนี้',
        you:(P)=>`คุณอยู่ <em>${P.label}</em> ${P.th} ✦ Check in ${P.ci_th}`,
        miss:'ยังไม่เจอชื่อนี้ ลองพิมพ์แค่บางส่วนของชื่อ หรือทักเพจ Anubis Cards and Craft ได้เลยครับ'},
    en:{lede:'Type your Ravensburger Play display name to see your pod and player number.',label:'Search your name',ph:'Your name or number, like M012',clear:'Clear',
        all:'All',m:'Morning',a:'Afternoon',mth:'',ath:'',cim:'CHECK IN 10:00 TO 10:45',cia:'CHECK IN 14:30 TO 15:00',
        podnote:'This is the final list. Main Sealed registration is closed for both pods ✦ You can still join Pack Rush and the Core Constructed side event.',tm:'10:00 to 10:45',ta:'14:30 to 15:00',
        venue:'Siam@Siam Design Hotel, 6th floor, Function Six ✦ BTS National Stadium',warn:'If you miss check in, your seat is given up.',
        gift:'A welcome gift from Kardiko for every player. Pick it up at check in.',
        pr:'<b>Pack Rush</b> No deck building: open 2 packs per round, 3 rounds ✦ Separate registration, open to everyone',cc:'<b>Core Constructed</b> side event ✦ Walk in, no registration needed',
        follow:'Details on the Facebook page',more:'More events at Anubis Cards and Craft: see the calendar',presented:'PRESENTED BY 4 STORES',
        fine:'Pods are ordered by registration time ✦ List updated '+UPD.en+' ✦ Can\'t find your name or something looks wrong? Message the Anubis Cards and Craft page.',
        total:n=>'',found:n=>`${n} found`,empty:'No match in this pod',
        you:(P)=>`You're in the <em>${P.label}</em> ✦ Check in ${P.ci_en}`,
        miss:'We can\'t find that name yet. Try typing just part of it, or message the Anubis Cards and Craft page.'}};
  let lang='th';
  const navLang=((navigator.language||'th').toLowerCase().startsWith('th')?'th':'en');
  let qLang=null; try{qLang=new URLSearchParams(location.search).get('lang');}catch(e){}
  if(qLang==='th'||qLang==='en') lang=qLang;
  else { try{const s=localStorage.getItem('podLang'); lang=(s==='th'||s==='en')?s:navLang;}catch(e){lang=navLang;} }
  const POD={m:{label:'Morning pod',th:'รอบเช้า',ci_th:'10:00 ถึง 10:45',ci_en:'10:00 to 10:45'},a:{label:'Afternoon pod',th:'รอบบ่าย',ci_th:'14:30 ถึง 15:00',ci_en:'14:30 to 15:00'}};
  function applyLang(){
    const L=T[lang]; document.documentElement.lang=lang;
    document.querySelectorAll('[data-i]').forEach(el=>{const v=L[el.dataset.i]; if(typeof v==='string') el.innerHTML=v;});
    document.getElementById('q').placeholder=L.ph;
    document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  }
  const q=document.getElementById('q'),clear=document.getElementById('clear'),count=document.getElementById('count'),result=document.getElementById('result');
  let filter='all';
  const Q=/[\u2018\u2019\u201B\u02BC\u0060\u00B4\u2032]/g;
  const norm=s=>s.toLowerCase().normalize('NFKC').replace(Q,"'").replace(/\s+/g,'');
  const loose=s=>norm(s).replace(/[^\p{L}\p{N}]/gu,'');
  const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function hl(name,t){ if(!t) return esc(name);
    const low=name.toLowerCase().replace(Q,"'"); const i=low.indexOf(t.toLowerCase().replace(Q,"'"));
    if(i<0) return esc(name); return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+t.length))+'</mark>'+esc(name.slice(i+t.length)); }
  // "a7", "M12" or "m064" all mean that player number
  const numKey=t=>{const m=t.trim().match(/^([ma])\s*0*(\d{1,3})$/i); return m?(m[1]+m[2].padStart(3,'0')).toLowerCase():null;};
  function match(r,t){ if(!t) return true; const k=norm(t), lk=loose(t), nk=numKey(t); if(nk) return norm(r.n)===nk; return norm(r.name).includes(k)||(lk.length>0&&loose(r.name).includes(lk))||norm(r.n)===k; }
  function render(){
    const raw=q.value.trim(); clear.hidden=!raw;
    let hits=0;
    for(const p of ['m','a']){
      const sec=document.getElementById('pod-'+p), ul=document.getElementById('list-'+p);
      sec.hidden = filter!=='all' && filter!==p;
      const rows=pods[p].filter(r=>match(r,raw)); hits+= sec.hidden?0:rows.length;
      ul.innerHTML = rows.length ? rows.map(r=>`<li class="${raw?'hit':''}"><b>${r.n}</b><span>${hl(r.name,raw)}</span></li>`).join('') : `<li style="grid-column:1/-1;background:none"><span class="empty">${T[lang].empty}</span></li>`;
    }
    const pool=all.filter(r=>(filter==='all'||filter===r.p)&&match(r,raw));
    count.textContent = raw ? T[lang].found(pool.length) : T[lang].total(filter==='all'?all.length:pods[filter].length);
    let pick=null;
    if(raw){ const k=norm(raw), lk=loose(raw); const nk=numKey(raw); pick=pool.find(r=>norm(r.name)===k||norm(r.n)===k||(nk&&norm(r.n)===nk)||(lk&&loose(r.name)===lk)) || (pool.length===1?pool[0]:null); }
    if(pick){
      const P=POD[pick.p];
      result.innerHTML=`<div class="found ${pick.p}"><div class="num"><span>PLAYER NO.</span><b>${pick.n}</b></div><div class="who"><div class="name">${esc(pick.name)}</div><div class="podline">${T[lang].you(P)}</div></div></div>`;
    } else if(raw && pool.length===0){
      result.innerHTML=`<p class="miss">${T[lang].miss}</p>`;
    } else result.innerHTML='';
  }
  q.addEventListener('input',render);
  clear.addEventListener('click',()=>{q.value='';render();q.focus();});
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    filter=b.dataset.f; document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    try{localStorage.setItem('podFilter',filter)}catch(e){}
    render();}));
  try{const f=localStorage.getItem('podFilter'); if(f&&f!=='all'){const b=document.querySelector(`.chip[data-f="${f}"]`); if(b) b.click();}}catch(e){}
  document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l; try{localStorage.setItem('podLang',lang)}catch(e){} applyLang(); render();}));
  applyLang();
  render();
})();
</script>

</body>
</html>
